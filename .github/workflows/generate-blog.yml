name: Generate Blog Post

on:
  workflow_dispatch:
    inputs:
      client_id:
        description: 'Client ID (e.g. bobe)'
        required: true
        default: 'bobe'
      week_of:
        description: 'Week start date YYYY-MM-DD'
        required: true
      topic_index:
        description: '0-based topic index from the weekly content'
        required: true
      platform:
        description: 'Source platform for the blog content'
        required: true
        default: 'twitter'
        type: choice
        options:
          - twitter
          - telegram
      extra_context:
        description: 'Additional context for the blog (optional)'
        required: false
        default: ''
      mock:
        description: 'Dry run — no API calls (for testing)'
        type: boolean
        default: false

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests openpyxl google-genai python-dotenv jinja2 flask pillow boto3

      - name: Create .env from secrets
        run: |
          echo "APIFY_API_TOKEN=${{ secrets.APIFY_API_TOKEN }}" >> .env
          echo "GOOGLE_AI_API_KEY=${{ secrets.GOOGLE_AI_API_KEY }}" >> .env
          echo "WAVESPEED_API_KEY=${{ secrets.WAVESPEED_API_KEY }}" >> .env
          echo "AIRTABLE_API_KEY=${{ secrets.AIRTABLE_API_KEY }}" >> .env
          echo "GH_REGEN_TOKEN=${{ secrets.GH_REGEN_TOKEN }}" >> .env
          echo "REGEN_WORKER_URL=${{ secrets.REGEN_WORKER_URL }}" >> .env
          echo "R2_ACCOUNT_ID=${{ secrets.R2_ACCOUNT_ID }}" >> .env
          echo "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}" >> .env
          echo "R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}" >> .env
          echo "R2_BUCKET_NAME=${{ secrets.R2_BUCKET_NAME }}" >> .env
          echo "R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}" >> .env
          echo "BASEROW_API_TOKEN=${{ secrets.BASEROW_API_TOKEN }}" >> .env
          echo "BASEROW_DATABASE_ID=${{ secrets.BASEROW_DATABASE_ID }}" >> .env
          echo "BASEROW_TABLE_CLIENT_SETTINGS=${{ secrets.BASEROW_TABLE_CLIENT_SETTINGS }}" >> .env
          echo "BASEROW_TABLE_CONTENT_APPROVALS=${{ secrets.BASEROW_TABLE_CONTENT_APPROVALS }}" >> .env
          echo "BASEROW_TABLE_IMAGE_STYLE_PREFS=${{ secrets.BASEROW_TABLE_IMAGE_STYLE_PREFS }}" >> .env

      - name: Set active client
        run: echo "${{ github.event.inputs.client_id }}" > .active-client

      - name: Generate blog post
        shell: bash
        run: |
          set -euo pipefail
          ARGS="--client ${{ github.event.inputs.client_id }}"
          ARGS="$ARGS --topic-index ${{ github.event.inputs.topic_index }}"
          ARGS="$ARGS --week-of ${{ github.event.inputs.week_of }}"
          ARGS="$ARGS --platform ${{ github.event.inputs.platform }}"
          ARGS="$ARGS --from-airtable"
          if [ -n "${{ github.event.inputs.extra_context }}" ]; then
            ARGS="$ARGS --extra-context \"${{ github.event.inputs.extra_context }}\""
          fi
          if [ "${{ github.event.inputs.mock }}" = "true" ]; then
            ARGS="$ARGS --mock"
          fi
          python scripts/blog_generator.py $ARGS

      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_static.py \
            --output dist \
            --include-admin \
            --client ${{ github.event.inputs.client_id }}

      - name: Copy admin panel to dist
        run: |
          mkdir -p dist/admin
          cp admin/index.html dist/admin/index.html
          cp admin/admin.css dist/admin/admin.css
          cp admin/admin.js dist/admin/admin.js

      - name: Deploy to GitHub Pages
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Generate blog: ${{ github.event.inputs.client_id }} ${{ github.event.inputs.week_of }} topic-${{ github.event.inputs.topic_index }}"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/rtadik/bobe-content-dashboard.git HEAD:gh-pages
          cd ..

      - name: Health check deployed site
        run: |
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://content.rejiglabs.com/ || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "Health check passed (HTTP $STATUS)"
          else
            echo "::warning::Health check returned HTTP $STATUS — site may not be fully propagated yet"
          fi
