name: Generate Announcement Content

on:
  workflow_dispatch:
    inputs:
      client_id:
        description: 'Client ID (e.g. bobe)'
        required: true
        default: 'bobe'
      week_of:
        description: 'Week start date YYYY-MM-DD'
        required: true
      announcement_text:
        description: 'Client announcement text (2 sentences to several paragraphs)'
        required: true
      mock:
        description: 'Dry run — no API calls (for testing)'
        type: boolean
        default: false

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  generate-announcement:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests openpyxl google-genai python-dotenv jinja2 flask pillow

      - name: Create .env from secrets
        run: |
          echo "APIFY_API_TOKEN=${{ secrets.APIFY_API_TOKEN }}" >> .env
          echo "GOOGLE_AI_API_KEY=${{ secrets.GOOGLE_AI_API_KEY }}" >> .env
          echo "WAVESPEED_API_KEY=${{ secrets.WAVESPEED_API_KEY }}" >> .env
          echo "AIRTABLE_API_KEY=${{ secrets.AIRTABLE_API_KEY }}" >> .env
          echo "GH_REGEN_TOKEN=${{ secrets.GH_REGEN_TOKEN }}" >> .env

      - name: Set active client
        run: echo "${{ github.event.inputs.client_id }}" > .active-client

      - name: Save announcement and generate content
        env:
          ANNOUNCEMENT_TEXT: ${{ github.event.inputs.announcement_text }}
        run: |
          ARGS="--client ${{ github.event.inputs.client_id }}"
          ARGS="$ARGS --week-of ${{ github.event.inputs.week_of }}"
          ARGS="$ARGS --mode announcement"
          ARGS="$ARGS --announcement-text \"$ANNOUNCEMENT_TEXT\""
          if [ "${{ github.event.inputs.mock }}" = "true" ]; then
            ARGS="$ARGS --mock"
          fi
          python scripts/pipeline_runner.py $ARGS --skip-deploy

      - name: Build static site
        run: |
          python scripts/build_static.py \
            --output dist \
            --include-admin \
            --client ${{ github.event.inputs.client_id }}

      - name: Copy admin panel to dist
        run: |
          mkdir -p dist/admin
          cp admin/index.html dist/admin/index.html
          cp admin/admin.css dist/admin/admin.css
          cp admin/admin.js dist/admin/admin.js

      - name: Deploy to GitHub Pages
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Generate announcement: ${{ github.event.inputs.client_id }} ${{ github.event.inputs.week_of }}"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/rtadik/bobe-content-dashboard.git HEAD:gh-pages
          cd ..
