name: Publish to X (Twitter)

on:
  workflow_dispatch:
    inputs:
      client_id:
        description: 'Client ID (e.g. bobe)'
        required: true
        default: 'bobe'
      week_of:
        description: 'Week start date YYYY-MM-DD'
        required: true
      topic_index:
        description: 'Topic index (0-based, 0-20)'
        required: true
        default: '0'

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install requests openpyxl google-genai python-dotenv jinja2 flask pillow tweepy

      - name: Create .env from secrets
        run: |
          echo "APIFY_API_TOKEN=${{ secrets.APIFY_API_TOKEN }}" >> .env
          echo "GOOGLE_AI_API_KEY=${{ secrets.GOOGLE_AI_API_KEY }}" >> .env
          echo "WAVESPEED_API_KEY=${{ secrets.WAVESPEED_API_KEY }}" >> .env
          echo "AIRTABLE_API_KEY=${{ secrets.AIRTABLE_API_KEY }}" >> .env
          echo "GH_REGEN_TOKEN=${{ secrets.GH_REGEN_TOKEN }}" >> .env
          echo "REGEN_WORKER_URL=${{ secrets.REGEN_WORKER_URL }}" >> .env
          echo "BOBE_X_API_KEY=${{ secrets.BOBE_X_API_KEY }}" >> .env
          echo "BOBE_X_API_SECRET=${{ secrets.BOBE_X_API_SECRET }}" >> .env
          echo "BOBE_X_ACCESS_TOKEN=${{ secrets.BOBE_X_ACCESS_TOKEN }}" >> .env
          echo "BOBE_X_ACCESS_TOKEN_SECRET=${{ secrets.BOBE_X_ACCESS_TOKEN_SECRET }}" >> .env

      - name: Set active client
        run: echo "${{ github.event.inputs.client_id }}" > .active-client

      - name: Publish thread to X
        shell: bash
        run: |
          set -euo pipefail
          python scripts/x_publisher.py \
            --client ${{ github.event.inputs.client_id }} \
            --week-of ${{ github.event.inputs.week_of }} \
            --topic-index ${{ github.event.inputs.topic_index }}

      - name: Commit updated workbook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/content/${{ github.event.inputs.client_id }}/
          git diff --cached --quiet || git commit -m "Publish topic ${{ github.event.inputs.topic_index }} to X: client=${{ github.event.inputs.client_id }}, week=${{ github.event.inputs.week_of }}"
          git push

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false

    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install requests openpyxl google-genai python-dotenv jinja2 flask pillow tweepy

      - name: Create .env from secrets
        run: |
          echo "APIFY_API_TOKEN=${{ secrets.APIFY_API_TOKEN }}" >> .env
          echo "GOOGLE_AI_API_KEY=${{ secrets.GOOGLE_AI_API_KEY }}" >> .env
          echo "WAVESPEED_API_KEY=${{ secrets.WAVESPEED_API_KEY }}" >> .env
          echo "AIRTABLE_API_KEY=${{ secrets.AIRTABLE_API_KEY }}" >> .env
          echo "GH_REGEN_TOKEN=${{ secrets.GH_REGEN_TOKEN }}" >> .env
          echo "REGEN_WORKER_URL=${{ secrets.REGEN_WORKER_URL }}" >> .env
          echo "BOBE_X_API_KEY=${{ secrets.BOBE_X_API_KEY }}" >> .env
          echo "BOBE_X_API_SECRET=${{ secrets.BOBE_X_API_SECRET }}" >> .env
          echo "BOBE_X_ACCESS_TOKEN=${{ secrets.BOBE_X_ACCESS_TOKEN }}" >> .env
          echo "BOBE_X_ACCESS_TOKEN_SECRET=${{ secrets.BOBE_X_ACCESS_TOKEN_SECRET }}" >> .env

      - name: Set active client
        run: echo "${{ github.event.inputs.client_id }}" > .active-client

      - name: Build static site
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_static.py \
            --output dist \
            --include-admin \
            --client ${{ github.event.inputs.client_id }}

      - name: Copy admin panel to dist
        run: |
          mkdir -p dist/admin
          cp admin/index.html dist/admin/index.html
          cp admin/admin.css dist/admin/admin.css
          cp admin/admin.js dist/admin/admin.js

      - name: Deploy to GitHub Pages
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish to X: client=${{ github.event.inputs.client_id }} topic=${{ github.event.inputs.topic_index }}"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/rtadik/bobe-content-dashboard.git HEAD:gh-pages
          cd ..

      - name: Health check deployed site
        run: |
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://content.rejiglabs.com/ || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "Health check passed (HTTP $STATUS)"
          else
            echo "::warning::Health check returned HTTP $STATUS — site may not be fully propagated yet"
          fi
